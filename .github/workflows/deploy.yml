name: Deploy

on:
  push:
    branches: [main, gh-pages]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish dist to the deployments bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          BUCKET: ${{ secrets.AWS_DEPLOY_BUCKET }}
        run: |
          if [ -z "$BUCKET" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "AWS deploy secrets are not on this repository yet."
            exit 0
          fi
          if [ "${{ github.ref_name }}" = "gh-pages" ]; then
            aws s3 sync . "s3://$BUCKET" --delete --exclude ".git/*" --exclude ".github/*"
          elif [ -d dist ] && [ -n "$(ls -A dist 2>/dev/null)" ]; then
            aws s3 sync dist "s3://$BUCKET" --delete
          else
            echo "This push has no site files to publish."
            exit 0
          fi
          echo "Published to s3://$BUCKET"
